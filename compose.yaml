services:
  karaoke-server:
    build:
      context: .
    container_name: karaoke-server
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /data/karaoke.sqlite
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
